spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/calango_dev}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  nome: ${APP_NAME:Viacao Calango API}
  ambiente: ${APP_ENV:development}

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs
    operations-sorter: method
    tags-sorter: alpha
  override-with-generic-response: false

calango:
  passagens:
    reserva-minutos: ${RESERVA_MINUTOS:15}
